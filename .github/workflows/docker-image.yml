name: Build, Push, and Deploy to Render

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore DocShareAPI.sln
      - run: dotnet build DocShareAPI.sln --no-restore --configuration Release
      - run: dotnet test DocShareAPI.sln --no-build --configuration Release
  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    # Checkout mã nguồn
    - name: Checkout code
      uses: actions/checkout@v3

    # Cài đặt Docker và Docker Compose
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    # Đăng nhập Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build image
    - name: Build Docker image with docker-compose
      run: |
        docker-compose -f docker-compose.yml build --build-arg BUILD_SHA="$GITHUB_SHA"

    # Tag image
    - name: Tag Docker image
      run: |
        docker tag docshareapi:latest ${{ secrets.DOCKER_USERNAME }}/docshareapi:${{ github.sha }}
        docker tag docshareapi:latest ${{ secrets.DOCKER_USERNAME }}/docshareapi:latest

    # Push image
    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/docshareapi:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/docshareapi:latest

    # Trigger Render Deploy
    - name: Trigger Render Deploy
      run: |
        curl --fail --show-error --silent --get --data-urlencode "imgURL=docker.io/$DOCKER_USERNAME/docshareapi:$GITHUB_SHA" "$RENDER_DEPLOY_HOOK"
      if: success()
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    - name: Verify readiness
      if: vars.RENDER_HEALTH_URL != ''
      env:
        READINESS_URL: ${{ vars.RENDER_HEALTH_URL }}
      run: |
        for attempt in $(seq 1 30); do
          if curl --fail --show-error --silent "$READINESS_URL" | jq -e --arg sha "$GITHUB_SHA" '.status == "ready" and .buildSha == $sha'; then exit 0; fi
          sleep 10
        done
        exit 1
